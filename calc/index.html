<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --panel:#111; --key:#1c1c1c; --line:#ffffff22; --text:#f2f2f2; --muted:#8a8a8a; --accent:#ff9f0a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--bg); color:var(--text); font-family:"Rubik",sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .calc { width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:20px; }
  .display { min-height:96px; text-align:right; padding:8px 4px 16px; word-break:break-all; }
  .expr { color:var(--muted); font-size:16px; min-height:20px; }
  .out { font-size:42px; font-weight:600; margin-top:6px; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button { font:inherit; cursor:pointer; border:0; }
  .k { height:64px; border-radius:16px; background:var(--key); color:var(--text); font-size:22px; }
  .k:active { filter:brightness(1.4); }
  .k.op { background:#2a2a2a; color:var(--accent); }
  .k.eq { background:var(--accent); color:#000; font-weight:600; }
  .k.zero { grid-column:span 2; }
  .overlay { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; padding:16px; }
  .overlay.show { display:flex; }
  .modal { width:100%; max-width:360px; background:#fff; color:#111; border-radius:20px; padding:24px; text-align:center; }
  .modal h2 { font-size:22px; margin-bottom:6px; }
  .modal p { color:#555; font-size:14px; }
  .price { font-size:40px; font-weight:600; margin:16px 0 4px; }
  .price small { font-size:16px; color:#777; }
  .perks { text-align:left; margin:16px 0; font-size:14px; line-height:1.8; list-style:none; }
  .pay { width:100%; height:52px; border-radius:14px; background:#111; color:#fff; font-size:17px; font-weight:600; }
  .pay:disabled { opacity:.6; cursor:wait; }
  .cancel { margin-top:10px; background:none; color:#888; font-size:14px; }
  .note { margin-top:12px; font-size:11px; color:#aaa; }
  .spinner { width:44px; height:44px; border:4px solid #ddd; border-top-color:#111; border-radius:50%;
             margin:20px auto; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .thinking::after { content:""; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
</style>
</head>
<body>
<div class="calc">
  <div class="display"><div class="expr" id="expr"></div><div class="out" id="out">0</div></div>
  <div class="keys" id="keys">
    <button class="k op" data-a="clear">C</button><button class="k op" data-a="back">⌫</button>
    <button class="k op" data-v="%">%</button><button class="k op" data-v="/">÷</button>
    <button class="k" data-v="7">7</button><button class="k" data-v="8">8</button><button class="k" data-v="9">9</button><button class="k op" data-v="*">×</button>
    <button class="k" data-v="4">4</button><button class="k" data-v="5">5</button><button class="k" data-v="6">6</button><button class="k op" data-v="-">−</button>
    <button class="k" data-v="1">1</button><button class="k" data-v="2">2</button><button class="k" data-v="3">3</button><button class="k op" data-v="+">+</button>
    <button class="k zero" data-v="0">0</button><button class="k" data-v=".">.</button><button class="k eq" data-a="eq">=</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
  const out = document.getElementById('out'), expr = document.getElementById('expr');
  const overlay = document.getElementById('overlay'), modal = document.getElementById('modal');
  let input = '';
  const show = () => out.textContent = input || '0';

  document.getElementById('keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) input += b.dataset.v;
    else if (b.dataset.a === 'clear') { input = ''; expr.textContent = ''; }
    else if (b.dataset.a === 'back') input = input.slice(0, -1);
    else if (b.dataset.a === 'eq' && input) return paywall();
    show();
  });

  function paywall() {
    modal.innerHTML = `
      <h2>Калькулятор Pro 👑</h2>
      <p>Чтобы узнать результат, оформите подписку</p>
      <div class="price">99 ₽ <small>/ месяц</small></div>
      <ul class="perks">
        <li>✅ Кнопка «=» без ограничений</li>
        <li>✅ Премиальные цифры</li>
        <li>✅ Нейросеть думает за вас</li>
      </ul>
      <button class="pay" id="pay">Оплатить</button>
      <button class="cancel" id="cancel">Нет, я посчитаю на пальцах</button>
      <div class="note">Это шутка — никакие деньги не списываются</div>`;
    overlay.classList.add('show');
    document.getElementById('cancel').onclick = () => overlay.classList.remove('show');
    document.getElementById('pay').onclick = processing;
  }

  function processing() {
    modal.innerHTML = `<h2>Обработка платежа</h2><div class="spinner"></div><p>Связываемся с банком…</p>`;
    setTimeout(() => {
      modal.innerHTML = `<h2>Оплата прошла ✅</h2><p>Спасибо! Вы теперь Pro.</p>`;
      setTimeout(think, 1200);
    }, 2000);
  }

  function think() {
    overlay.classList.remove('show');
    expr.textContent = input + ' =';
    out.innerHTML = '<span class="thinking" style="font-size:22px">Думаю</span>';
    setTimeout(() => { out.textContent = 'Hello World'; input = ''; }, 3000);
  }
</script>
</body>
</html>
